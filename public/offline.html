<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ming — offline</title>
<style>
  :root { --bg: #faf8f4; --text: #1f1a14; --muted: #a89d8e; --accent: #8b6a3a; --accent-soft: #fff7ec; --accent-border: #e8d4a8; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0a0a08; --text: #f0ece0; --muted: #6b6354; --accent: #d4a843; --accent-soft: rgba(212,168,67,0.07); --accent-border: rgba(212,168,67,0.2); }
  }
  * { box-sizing: border-box; margin: 0; }
  body { min-height: 100vh; min-height: 100dvh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; padding: 24px; text-align: center; background: var(--bg); color: var(--text); font-family: system-ui, -apple-system, sans-serif; }
  .char { font-family: "Noto Serif SC", "Songti SC", SimSun, serif; font-size: 48px; color: var(--accent); line-height: 1; }
  h1 { font-size: 18px; font-weight: 600; }
  p { font-size: 14px; color: var(--muted); max-width: 300px; line-height: 1.5; }
  button { margin-top: 8px; padding: 10px 20px; border-radius: 10px; border: 1px solid var(--accent-border); background: var(--accent-soft); color: var(--accent); font-size: 14px; font-weight: 600; cursor: pointer; }
</style>
</head>
<body>
  <div class="char">明</div>
  <h1>You're offline</h1>
  <p>Ming needs a connection to chat and save your progress. Reconnect and try again.</p>
  <button onclick="location.reload()">Try again</button>
</body>
</html>
